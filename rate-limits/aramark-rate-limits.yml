description: Aramark publishes no rate limits for the Marko platform. Searched the developer portal, the FAQ
  page, all 60 published OpenAPI documents and the markoapis repository; no limit, quota, burst, window or
  throttling threshold is stated anywhere.
notes: No X-RateLimit-*, RateLimit-* or Retry-After header is documented on any of the 216 operations, and
  no 429 response is declared in any of the 60 contracts (the only declared 4xx codes across the platform are
  400, 401, 404 and 405). The platform runs on Apigee Edge, which supports quota and spike-arrest policies,
  so limits very likely exist at the gateway — they are simply not disclosed to consumers, and an agent has
  no runtime signal to back off on. Recorded as an honest zero.
