- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor any Retry-After header that
    may be returned, even though the provider does not publish formal retry semantics.
- name: Contract-Scoped Limits
  description: Quotas, burst, and concurrency ceilings are governed by the individual customer or partner contract
    rather than a public policy. Coordinate with the provider to confirm thresholds before scaling traffic.
