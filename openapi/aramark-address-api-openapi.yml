components:
  parameters:
    orgValueParam:
      in: path
      name: org_value
      required: true
      description: provide business organization code in URL to filter data set
      schema:
        type: string
    formatParam:
      in: query
      name: format
      required: false
      description: allows to change the output to a desired format. 'JSON' - JSON, 'CSV' - CSV, 'XLS' - Excel
      schema:
        type: string
        enum:
        - JSON
        - CSV
        - XLS
    sizeParam:
      in: query
      name: size
      description: Number of records to be returned in each page of result set
      schema:
        type: string
        default: 50
    addressTypeParam:
      in: query
      name: address_type
      description: optional parameter to limit results to a specfic address type
      schema:
        type: string
        enum:
        - billing
        - forwarding
        - mailing
        - physical
        - remit
        - shipping
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment. Only applicable in QA.
      schema:
        type: string
    pageParam:
      in: query
      name: page
      description: Page number of result set
      schema:
        type: number
        default: 1
    searchParam:
      in: query
      name: search
      description: Used to search a specific Profit Center.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
  schemas:
    business_unit_address_details:
      type: object
      properties:
        org_type:
          type: string
          description: Type of Aramark Organization
        org_value:
          type: string
          description: Aramark Organization code
        org_name:
          type: string
          description: Name of the Aramark Organization
        org_address_status:
          type: string
          description: Indicator if the Profit Center Address is Active or not
        address_type:
          type: string
          description: Description of the Type of Address of the Profit Center
        attn_line:
          type: string
          description: Attention Line of the Address of the Profit Center
        address_line_1:
          type: string
          description: First Address line of the Profit Center
        address_line_2:
          type: string
          description: Second Address line of the Profit Center
        address_line_3:
          type: string
          description: Third Address line of the Profit Center
        address_line_4:
          type: string
          description: Fourth Address line of the Profit Center
        address_line_5:
          type: string
          description: Fifth Address line of the Profit Center
        city_locality:
          type: string
          description: City or Locality of the Profit Center
        state_province:
          type: string
          description: Sate or Province of the Profit Center
        postal_code:
          type: string
          description: Postal Code of the Profit Center
        country:
          type: string
          description: Country of the Profit Center
        country_code:
          type: string
          description: Code of the Country of the Profit Center
        longitude:
          type: string
          description: Longitude value of the Profit Center
        latitude:
          type: string
          description: Latitude value of the Profit Center
        source:
          type: string
          description: Source system for the Address Longitude and Latitude
        formatted_address:
          type: string
          description: Fully formatted Address of the Profit Center
        is_validated:
          type: string
          description: Indicator if the Profit Center Address has been validated or not
        postal_town:
          type: string
          description: Postal Town of the Profit Center
        neighborhood:
          type: string
          description: Neighborhood of the Profit Center
        establishment:
          type: string
          description: Establishment of the Profit Center
