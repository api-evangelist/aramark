openapi: 3.2.0
info:
  description: 'This API will return Alert Notifications.


    __The base endpoint URL for this API in production is:__ `https://marko.aramark.net/v1/alerts`.


    For testing the API with the "Try" tool on this page or in your app, use either our testing server "qa-marko" or our development server "dev-marko".'
  version: 1.0.0-oas3
  title: Alerts Purchasing API
servers:
- url: https://qa-marko.aramark.net/v1/alerts
  description: Testing server
- url: https://dev-marko.aramark.net/v1/alerts
  description: Development server
security:
- apiKey: []
tags:
- name: Purchasing
  description: Gets Purchasing Alert details
paths:
  /purchasing/order/{org_value}:
    get:
      summary: Purchasing alerts
      description: 'Returns Purchasing Alerts


        !This endpoint is in production'
      operationId: getPuchasingAlertsByOrgValue
      tags:
      - Purchasing
      parameters:
      - $ref: '#/components/parameters/orgValueParam'
      - $ref: '#/components/parameters/startDateParam'
      - $ref: '#/components/parameters/endDateParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Provides the purchasing order alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                    default: Success
                  count:
                    type: integer
                    description: Number of records being returned
                  purchasing_order_alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/purchasing_order_alerts'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
components:
  parameters:
    startDateParam:
      in: query
      name: start_date
      description: Calendar date for daily transactions. "mm/dd/yyyy"
      required: false
      schema:
        type: string
    orgValueParam:
      in: path
      name: org_value
      description: provide business organization code in URL to filter data set
      required: true
      schema:
        type: string
    endDateParam:
      in: query
      name: end_date
      description: Calendar date end date for daily transactions. Will use start_date if not provided. "mm/dd/yyyy"
      required: false
      schema:
        type: string
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: false
    smokeParam:
      in: header
      name: smoke
      description: 'When set to ''true'' this HTTP header variable will route the API call to

        the Integration testing environment. Only applicable in QA.

        '
      schema:
        type: string
        default: false
  schemas:
    purchasing_order_alerts:
      type: object
      properties:
        ordered_date:
          type: string
          description: Date the order was placed
        need_by_date:
          type: string
          description: Date the order is needed by
        profit_center:
          type: string
          description: Aramark Organization code for rollup
        profit_center_name:
          type: string
          description: Name of Aramark Organization rollup
        order_id:
          type: string
          description: Unique identifier of the purchase order
        status:
          type: string
          description: Current status of the order
          enum:
          - Ordered
          - Receiving
        time_updated:
          type: string
          description: Timestamp of the last change in order status
        preparer:
          type: string
          description: Email address of individual who prepared the order
        update_date:
          type: string
          description: Date and Time of the most recent refresh of data
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify permissions.
