openapi: 3.2.0
info:
  description: 'This API will return Alert Notifications.


    __The base endpoint URL for this API in production is:__ `https://marko.aramark.net/v1/alerts`.


    For testing the API with the "Try" tool on this page or in your app, use either our testing server "qa-marko" or our development server "dev-marko".'
  version: 1.0.0-oas3
  title: Alerts API
servers:
- url: https://qa-marko.aramark.net/v1/alerts
  description: Testing server
- url: https://dev-marko.aramark.net/v1/alerts
  description: Development server
security:
- apiKey: []
tags:
- name: Alerts
  description: Get Daily Profit Center Alerts Aggregate
paths:
  /profit_centers:
    get:
      summary: Profit center alerts
      description: 'Returns an aggregate of alerts at a Profit Center level


        !This endpoint is in production'
      operationId: getProfitCenterAlerts
      tags:
      - Alerts
      parameters:
      - $ref: '#/components/parameters/userIdParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Provides the labor forecast data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                    default: Success
                  count:
                    type: integer
                    description: Number of records being returned
                  notifications:
                    type: array
                    items: null
                    $ref: '#/components/schemas/notifications'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
components:
  parameters:
    userIdParam:
      in: query
      name: user_id
      description: Email address of the manager
      required: true
      schema:
        type: string
    sizeParam:
      name: size
      in: query
      description: Number of records to be returned in each page of result set
      schema:
        type: string
        default: 50
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: false
    smokeParam:
      in: header
      name: smoke
      description: 'When set to ''true'' this HTTP header variable will route the API call to

        the Integration testing environment. Only applicable in QA.

        '
      schema:
        type: string
        default: false
    pageParam:
      in: query
      name: page
      escription: Page number of result set
      required: false
      schema:
        type: number
        default: 1
  schemas:
    alerts:
      type: object
      properties:
        type:
          type: string
          description: description of the type of alert
          enum:
          - LABOR
          - PURCHASE ORDER
          - POINT OF SALES
        value:
          type: number
          description: value of the alert
    notifications:
      type: object
      properties:
        profit_center:
          type: string
          description: Aramark Organization code
        profit_center_name:
          type: string
          description: Name of the Profit Center
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/alerts'
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify permissions.
