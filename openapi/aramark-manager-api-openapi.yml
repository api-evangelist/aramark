openapi: 3.2.0
info:
  description: 'This API will return Employee information


    The base endpoint URL for this API in production is: `https://marko.aramark.net/v1/labor/employee`.


    For testing the API with the "Try" tool on this page or in your app, use either our testing server "qa-marko" or our development server "dev-marko".'
  version: 1.0.0-oas3
  title: Labor Employee Manager API
servers:
- url: https://qa-marko.aramark.net/v1/labor/employee
  description: Testing server
- url: https://dev-marko.aramark.net/v1/labor/employee
  description: Development server
security:
- apiKey: []
tags:
- name: Manager
  description: Get Manager information for an Employee
paths:
  /manager:
    get:
      summary: Manager id of employee
      description: 'Returns a manager id of employee.


        !This endpoint is in prod'
      operationId: getEmployeeManager
      tags:
      - Manager
      parameters:
      - $ref: '#/components/parameters/employeeIdParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Provides the Supervisor data for an employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                    default: Success
                  count:
                    type: integer
                    description: Number of records being returned
                  manager:
                    type: array
                    items:
                      $ref: '#/components/schemas/manager'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
components:
  schemas:
    manager:
      type: object
      properties:
        manager_id:
          type: string
          description: Unqiue ID for the employee's manager
  parameters:
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment.  Only applicable in QA.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    employeeIdParam:
      in: query
      name: employee_id
      description: Unique identifier of the employee
      required: true
      schema:
        type: string
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify permissions.
