openapi: 3.2.0
info:
  title: Aramark Core API
  version: 1.0.0-oas3
  description: 'Operations tagged Core across 2 of this provider''s published API definitions: aramark-location-core-details-openapi.json, aramark-organization-profit-center-core-details-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://qa-marko.aramark.net/v1/<base_path>
  description: Testing server
- url: https://dev-marko.aramark.net/v1/organization
- url: https://qa-marko.aramark.net/v1/organization
  description: Testing server
security:
- apiKey: []
tags:
- name: Core
paths:
  /location/core/{org_value}:
    get:
      operationId: getLocationDetailsCoreByOrgValue
      tags:
      - Core
      summary: Returns a collection of Location Core Attributes for One Location
      parameters:
      - $ref: '#/components/parameters/orgValueParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Collection of Location Core Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  location_core_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/location_core_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/<base_path>
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
  /location/core:
    get:
      operationId: getLocationDetailsCore
      tags:
      - Core
      summary: Returns a collection of Location Core Attributes
      parameters:
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Collection of Location Core Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  location_core_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/location_core_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/<base_path>
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
  /profit_center/core/{org_value}:
    get:
      operationId: getProfitCenterDetailsCoreByOrgValue
      tags:
      - Core
      summary: Returns a collection of Profit Center Core Attributes for One Profit Center
      description: '!This endpoint is in production'
      parameters:
      - $ref: '#/components/parameters/orgValueParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Collection of Profit Center Core Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  profit_center_core_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/profit_center_core_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
  /profit_center/core:
    get:
      operationId: getProfitCenterDetailsCore
      tags:
      - Core
      summary: Returns a collection of Profit Center Core Attributes
      description: '!This endpoint is in production'
      parameters:
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Collection of Profit Center Core Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  profit_center_core_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/profit_center_core_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
components:
  parameters:
    orgValueParam:
      in: path
      name: org_value
      required: true
      description: provide business organization code in URL to filter data set
      schema:
        type: string
    sizeParam:
      in: query
      name: size
      description: Number of records to be returned in each page of result set
      schema:
        type: string
        default: 50
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment. Only applicable in QA.
      schema:
        type: string
    pageParam:
      in: query
      name: page
      description: Page number of result set
      schema:
        type: number
        default: 1
    searchParam:
      in: query
      name: search
      description: Used to search a specific Profit Center.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
  schemas:
    location_core_details:
      type: object
      properties:
        org_value:
          type: string
          description: Aramark Organization code
        org_name:
          type: string
          description: Name of the Aramark Organization
        status:
          type: string
          description: Indicator if the Location is Active or not
        status_description:
          type: string
          description: Description of whether the Location is Active or not
        country:
          type: string
          description: Country where the Location operates
        profit_center_value:
          type: string
          description: Profit Center value for the Location
        profit_center_name:
          type: string
          description: Name of the Profit Center of the Location
        legacy_value:
          type: string
          description: Legacy CSP value of the Location
        public_name:
          type: string
          description: Public name of the Location
        short_name:
          type: string
          description: Short Name of the Location
        payroll_org_value:
          type: string
          description: Payroll Org Value of the Location
        type_code:
          type: string
          description: Code for the Type of Location
        type_description:
          type: string
          description: Type of Location
        wfm_reference:
          type: string
          description: WFM Reference for the Location
        primary_flag:
          type: string
          description: Primary Flag value for the Location
        operation_start_date:
          type: string
          description: Date on which the Location operations started
        operation_close_date:
          type: string
          description: Date on which the Location operations closed
        bill_code:
          type: string
          description: Code for Bill of the Location
        bill_description:
          type: string
          description: Bill for the Location
        intercompany_code:
          type: string
          description: Intercompany Code for the Location
        intercompany_description:
          type: string
          description: Intercompany for the Location
        future_code:
          type: string
          description: Future Code for the Location
        future_description:
          type: string
          description: Future for the Location
        event_code:
          type: string
          description: Event Code for the Location
        event_description:
          type: string
          description: Event for the Location
        tax_code:
          type: string
          description: Tax Code for the Location
        tax_description:
          type: string
          description: Tax for the Location
        service_type_code:
          type: string
          description: Service Type Code for the Location
        service_type_description:
          type: string
          description: Service Type for the Location
        concept_code:
          type: string
          description: Concept Code for the Location
        concept_description:
          type: string
          description: Concept for the Location
        postal_code:
          type: string
          description: Postal Code for the Location
        calc_contract_type:
          type: string
          description: Calc Contract Type for the Location
        calc_contract_type_id:
          type: string
          description: Calc Contract Type ID for the Location
        timezone:
          type: string
          description: Timezone for the Location
    profit_center_core_details:
      type: object
      properties:
        org_value:
          type: string
          description: Aramark Organization code
        org_name:
          type: string
          description: Name of the Aramark Organization
        status:
          type: string
          description: Indicator if the Profit Center is Active or not
        status_description:
          type: string
          description: Description of whether the Profit Center is Active or not
        country:
          type: string
          description: Country where the Profit Center operates
        public_name:
          type: string
          description: Public name of the Profit Center
        legacy_value:
          type: string
          description: Legacy CSP value of the Profit Center
        open_date:
          type: string
          description: Date on which the Profit Center opened
        on_site_date:
          type: string
          description: Date on which Aramark was on site for the Profit Center
        operational_close_date:
          type: string
          description: Date on which operations closed for the Profit Center
        close_date:
          type: string
          description: Date on which the Profit Center closed
        line_of_service_code:
          type: string
          description: Code for the line of service of the Profit Center
        line_of_service:
          type: string
          description: Description of the line of service of the Profit Center
        default_service_type_code:
          type: string
          description: Code for default service type of the Profit Center
        default_service_type:
          type: string
          description: Description of the default service type of the Profit Center
        contract_type_code:
          type: string
          description: Code for the contract type of the Profit Center
        contract_type:
          type: string
          description: Description of the contract type of the Profit Center
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify permissions.
x-refined-from:
- aramark-location-core-details-openapi.json
- aramark-organization-profit-center-core-details-openapi.json
