openapi: 3.2.0
info:
  description: 'This API will return Daily Labor Metrics data from Aramark''s labor management systems.


    The base endpoint URL for this API in production is:

    `https://marko.aramark.net/v1/labor/daily`.


    For testing the API with the "Try" tool on this page or in your app, use

    either our testing server "qa-marko" or our development server "dev-marko".'
  version: 1.0.0-oas3
  title: Labor Daily Employee Daily Schedule API
servers:
- url: https://qa-marko.aramark.net/v1/labor/daily
  description: Testing server
- url: https://dev-marko.aramark.net/v1/labor/daily
  description: Development server
security:
- apiKey: []
tags:
- name: Employee Daily Schedule
paths:
  /employee/schedule/{org_value}:
    get:
      summary: Employee daily schedule
      description: 'Returns Employee Daily Schedule


        !This endpoint is in development'
      operationId: getDailyEmployeeScheduleByOrgValue
      tags:
      - Employee Daily Schedule
      parameters:
      - $ref: '#/components/parameters/orgValueParam'
      - $ref: '#/components/parameters/startDateParam'
      - $ref: '#/components/parameters/endDateParam'
      - $ref: '#/components/parameters/employeeIdParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Provides daily employee schedule data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                    default: Success
                  count:
                    type: integer
                    description: Number of records being returned
                  employee_schedule:
                    type: array
                    items:
                      $ref: '#/components/schemas/employee_schedule'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
components:
  parameters:
    startDateParam:
      in: query
      name: start_date
      description: Calendar date for daily transactions. "mm/dd/yyyy"
      required: true
      schema:
        type: string
    orgValueParam:
      in: path
      name: org_value
      description: Aramark Business Organization code to filter data set
      required: true
      schema:
        type: string
    endDateParam:
      in: query
      name: end_date
      description: Calendar end date for daily transactions. Will use start_date if not provided. "mm/dd/yyyy"
      required: false
      schema:
        type: string
    employeeIdParam:
      in: query
      name: employee_id
      description: Unique identifier for an individual employee
      required: false
      schema:
        type: string
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment. Only applicable in QA.
      schema:
        type: string
        default: 'false'
  schemas:
    employee_schedule:
      type: object
      properties:
        calendar_date:
          type: string
          description: Date or transactional rollup
        org_value:
          type: string
          description: Aramark Organization code for rollup
        source_site_id:
          type: string
          description: unique ID of the source site
        source_site_code:
          type: string
          description: code of the source site
        source_site_name:
          type: string
          description: name of the source site
        source_pc_id:
          type: string
          description: unique ID of the source profit center
        source_pc_code:
          type: string
          description: code of the source profit center
        source_pc_name:
          type: string
          description: name of the profit center
        source_location_id:
          type: string
          description: unique ID of the source location
        source_location_code:
          type: string
          description: code of the source location
        source_location_name:
          type: string
          description: name of the source location
        source_department_id:
          type: string
          description: unique ID of the source department
        source_department_code:
          type: string
          description: code of the source department
        source_department_name:
          type: string
          description: name of the source department
        source_job_id:
          type: string
          description: unique ID of the source job
        source_job_code:
          type: string
          description: code of the source job
        source_job_name:
          type: string
          description: name of the source job
        first_name:
          type: string
          description: first name of the employee
        last_name:
          type: string
          description: last name of the employee
        employment_status:
          type: string
          description: active status of the employee
        full_time_indicator:
          type: string
          description: indicator of the employee's full time status
        employee_status:
          type: string
          description: status of the employee
        seasonal_flag:
          type: string
          description: indicator of whether or not the employee is seasonal
        union_flag:
          type: string
          description: T or F indicator of whether or not the employee is a union member
        agency_flag:
          type: string
          description: T or F indicator of whether or not the employee is an agency worker
        non_aramark_employee_flag:
          type: string
          description: T or F indicator of whether or not the employee works for Aramark
        actual_prod_hours:
          type: number
          description: Actual Productive Hours
        actual_non_prod_hours:
          type: number
          description: Actual Non Productive Hours
        actual_overtime_hours:
          type: number
          description: Actual Overtime Hours
        sched_prod_hours:
          type: number
          description: Scheduled Productive Hours
        sched_non_prod_hours:
          type: number
          description: Scheduled Non Productive Hours
        sched_overtime_hours:
          type: number
          description: Scheduled Overtime Hours
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify permissions.
