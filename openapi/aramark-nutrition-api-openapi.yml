openapi: 3.2.0
info:
  title: Aramark Nutrition API
  version: 1.0.0-oas3
  description: 'Operations tagged Nutrition across 2 of this provider''s published API definitions: aramark-service-recipes-v2-openapi.json, aramark-service-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://qa-marko.aramark.net/v2/service/recipe
  description: Testing server
- url: https://dev-marko.aramark.net/v2/service/recipe
  description: Development server
- url: https://qa-marko.aramark.net/v3/service
  description: Testing server
- url: https://dev-marko.aramark.net/v3/service
  description: Development server
tags:
- name: Nutrition
  description: A collection of Nutrition Data
paths:
  /nutrition:
    get:
      summary: Service Recipe Nutrition
      description: Returns a Service Recipe Nutrition Data
      operationId: getServiceRecipeNutritionV2
      tags:
      - Nutrition
      parameters:
      - $ref: '#/components/parameters/locationIdNoReqParam'
      - $ref: '#/components/parameters/serviceAreaIdNoReqParam'
      - $ref: '#/components/parameters/recipeIdParam'
      - $ref: '#/components/parameters/sourceSystemParam'
      - $ref: '#/components/parameters/lastModifiedDateNoReqParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Service Recipe Nutrition Data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: string
                    description: Number of records
                  nutrition:
                    type: array
                    items:
                      $ref: '#/components/schemas/nutrition'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v2/service/recipe
      description: Testing server
    - url: https://dev-marko.aramark.net/v2/service/recipe
      description: Development server
  /nutrition/update:
    get:
      summary: Service Recipe Nutrition Updates
      description: Returns Service Recipes with Nutrition Data Updates
      operationId: getServiceRecipeNutritionUpdates
      tags:
      - Nutrition
      parameters:
      - $ref: '#/components/parameters/sourceSystemParam'
      - $ref: '#/components/parameters/lastModifiedDateParam'
      responses:
        '200':
          description: Status of the Update Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: string
                    description: Number of records
                  nutrition_updates:
                    type: array
                    items:
                      $ref: '#/components/schemas/nutrition_updates'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v2/service/recipe
      description: Testing server
    - url: https://dev-marko.aramark.net/v2/service/recipe
      description: Development server
  /recipe/nutrition:
    get:
      summary: Service Recipe Nutrition
      description: Returns a Service Recipe Nutrition Data
      operationId: getServiceRecipeNutritionV3
      tags:
      - Nutrition
      parameters:
      - $ref: '#/components/parameters/locationIdNoReqParam'
      - $ref: '#/components/parameters/serviceAreaIdNoReqParam'
      - $ref: '#/components/parameters/recipeIdParam'
      - $ref: '#/components/parameters/lastModifiedDateNoReqParam_2'
      - $ref: '#/components/parameters/bypassCacheParam'
      responses:
        '200':
          description: Service Recipe Nutrition Data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: number
                    description: Number of records
                  nutrition:
                    type: array
                    items:
                      $ref: '#/components/schemas/nutrition_2'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v3/service
      description: Testing server
    - url: https://dev-marko.aramark.net/v3/service
      description: Development server
  /recipe/nutrition/update:
    get:
      summary: Service Recipe Nutrition Updates
      description: Returns Service Recipes with Nutrition Data Updates
      operationId: getServiceRecipeNutritionUpdatesV3
      tags:
      - Nutrition
      parameters:
      - $ref: '#/components/parameters/lastModifiedDateParam_2'
      responses:
        '200':
          description: Status of the Update Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: number
                    description: Number of records
                  nutrition_updates:
                    type: array
                    items:
                      $ref: '#/components/schemas/nutrition_updates_2'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v3/service
      description: Testing server
    - url: https://dev-marko.aramark.net/v3/service
      description: Development server
components:
  parameters:
    lastModifiedDateNoReqParam:
      name: last_modified_date
      in: query
      description: Last Modified Date of the data
      required: false
      schema:
        type: string
    recipeIdParam:
      name: recipe_id
      in: query
      description: ID of the Recipe
      required: false
      schema:
        type: string
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    sourceSystemParam:
      name: source_system
      in: query
      description: Inventory source system
      required: true
      schema:
        type: string
        enum:
        - PRMA
    serviceAreaIdNoReqParam:
      name: service_area_id
      in: query
      description: ID of the Service Area. Must pass Location ID or Service Area ID
      required: false
      schema:
        type: number
    smokeParam:
      in: header
      name: smoke
      description: 'When set to ''true'' this HTTP Header variable will route to the Integration environment.  Only applicable in QA Server.

        '
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    lastModifiedDateParam:
      name: last_modified_date
      in: query
      description: Last Modified Date of the data
      required: true
      schema:
        type: string
    locationIdNoReqParam:
      name: location_id
      in: query
      description: ID of the location. Must pass Location ID or Service Area ID
      required: false
      schema:
        type: number
    lastModifiedDateNoReqParam_2:
      name: last_update_date
      in: query
      description: Last Update Date of the data
      required: false
      schema:
        type: string
    lastModifiedDateParam_2:
      name: last_update_date
      in: query
      description: Last Modified Date of the data
      required: true
      schema:
        type: string
