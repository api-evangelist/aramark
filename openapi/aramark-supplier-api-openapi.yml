openapi: 3.2.0
info:
  title: Aramark Supplier API
  version: 1.0.0
  description: 'Operations tagged Supplier across 3 of this provider''s published API definitions: aramark-organization-suppliers-openapi.json, aramark-product-openapi.json, aramark-product-retail-items-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://qa-marko.aramark.net/v1/organization
- url: https://qa-marko.aramark.net/v1
- url: https://dev-marko.aramark.net/v1
- url: https://qa-marko.aramark.net/v1/product
tags:
- name: Supplier
  description: This API will return a list of Organizational Supplier information
paths:
  /suppliers/{org_value}:
    get:
      summary: Return a collection of Organizational Supplier information
      operationId: getOrganizationSupplier
      parameters:
      - in: path
        name: org_value
        description: Location Code to have Suppliers returned for
        required: true
        schema:
          type: string
      - in: query
        name: search
        description: Used to search for a supplier against Name or MSA
        required: false
        schema:
          type: string
      - in: query
        name: enablement_type
        description: User to filter records by Supplier Enablement Type. Multiple entries allowed in a comma separated list
        required: false
        schema:
          type: string
          enum:
          - DIRECT BILL
          - ERCV
          - PROGRAM - INVOICE ONLY
          - PUNCHOUT
          - ADOPTED
      - in: query
        name: enabled_only
        description: Flag used to determine if the Supplier is Enabled or not
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: true
      - name: page
        in: query
        description: Page number of result set
        required: false
        schema:
          type: string
          default: 1
      - name: size
        in: query
        description: Number of records to be returned in each page of result set
        schema:
          type: string
          default: 50
      - name: bypass-cache
        in: header
        description: This HTTP Header variable will bypass cache
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: false
      - name: apikey
        in: header
        description: This HTTP Header variable will verify permissions.
        schema:
          type: string
      - name: smoke
        in: header
        description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment.  Only applicable in QA.
        schema:
          type: string
          default: false
      tags:
      - Supplier
      responses:
        '200':
          description: List of supplier information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned in request
                  page:
                    type: number
                    description: Page number of the result set
                  size:
                    type: number
                    description: Size of the result set
                  suppliers:
                    type: array
                    items:
                      $ref: '#/components/schemas/suppliers'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization
  /product/supplier/items/{org_value}:
    get:
      tags:
      - Supplier
      description: Returns location level data for supplier items
      operationId: getSupplierItemsbyLocation
      parameters:
      - name: org_value
        in: path
        description: Aramark Location code; Required if MSA not provided
        required: true
        schema:
          type: string
      - name: msa
        in: query
        description: MSA of item
        required: true
        schema:
          type: string
      - name: bypass-cache
        in: header
        description: This HTTP Header variable will bypass cache
        schema:
          type: string
          default: 'false'
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: Lists Supplier Item details by Location
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: string
                    description: Number of records returned in request
                  page:
                    type: number
                    description: Page Number of the result set
                  size:
                    type: number
                    description: Size of the result set
                  supplier_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/supplier_items'
        '404':
          description: Requested resource does not exist.
          content: {}
        '405':
          description: HTTP Verb / Operation not supported
          content: {}
      summary: Get supplier itemsby location
      x-summary-source: derived
    servers:
    - url: https://qa-marko.aramark.net/v1
    - url: https://dev-marko.aramark.net/v1
  /product/supplier/items:
    get:
      tags:
