openapi: 3.2.0
info:
  title: Aramark Financial API
  version: 1.0.0-oas3
  description: 'Operations tagged Financial across 2 of this provider''s published API definitions: aramark-organization-hierarchy-openapi.json, aramark-organization-profit-center-core-details-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://qa-marko.aramark.net/v1/organization/hierarchy
  description: Testing server
- url: https://dev-marko.aramark.net/v1/organization/hierarchy
  description: Development server
- url: https://qa-marko.aramark.net/v1/organization
  description: Testing server
- url: https://dev-marko.aramark.net/v1/organization
security:
- apiKey: []
tags:
- name: Financial
  description: Get Financial Hierarchy Nodes
paths:
  /financial/{org_value}:
    get:
      operationId: getFinancialHierarchy
      summary: Financial hierarchy nodes
      description: 'Returns financial hierarchy nodes.


        !This endpoint is in prod'
      tags:
      - Financial
      parameters:
      - $ref: '#/components/parameters/orgValueParam'
      - $ref: '#/components/parameters/hierarchyLevelParam'
      - $ref: '#/components/parameters/statusParam'
      - $ref: '#/components/parameters/searchParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Provides Aramark Financial Hierarchy Nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                    default: Success
                    example: Success
                  count:
                    type: string
                    description: Number of records returned
                    default: '0'
                    example: '1'
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/financial_organizations'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization/hierarchy
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization/hierarchy
      description: Development server
  /profit_center/financial/{org_value}:
    get:
      operationId: getProfitCenterDetailsFinancialByOrgValue
      tags:
      - Financial
      summary: Returns a collection of Profit Center Financial Attributes for One Profit Center
      description: '!This endpoint is in production'
      parameters:
      - $ref: '#/components/parameters/orgValueParam_2'
      - $ref: '#/components/parameters/formatParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam_2'
      responses:
        '200':
          description: Collection of Profit Center Financial Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  profit_center_financial_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/profit_center_financial_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
  /profit_center/financial:
    get:
      operationId: getProfitCenterDetailsFinancial
      tags:
      - Financial
      summary: Returns a collection of Profit Center Financial Attributes
      description: '!This endpoint is in production'
      parameters:
      - $ref: '#/components/parameters/searchParam_2'
      - $ref: '#/components/parameters/formatParam'
      - $ref: '#/components/parameters/pageParam'
      - $ref: '#/components/parameters/sizeParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam_2'
      responses:
        '200':
          description: Collection of Profit Center Financial Attributes
          content:
            '*/*':
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success' or 'Error'
                    default: Success
                  count:
                    type: string
                    description: Number of records returned
                  profit_center_financial_details:
                    type: array
                    items:
                      $ref: '#/components/schemas/profit_center_financial_details'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
    servers:
    - url: https://qa-marko.aramark.net/v1/organization
      description: Testing server
    - url: https://dev-marko.aramark.net/v1/organization
components:
  parameters:
    orgValueParam:
      in: path
      name: org_value
      description: 'Aramark Organization code. This must be at the same level of the top_node parameter. Expects nine characters, _include leading zeros_.

        '
      required: true
      schema:
        type: string
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
    hierarchyLevelParam:
      in: query
      name: hierarchy_level
      description: "This will determine the level of the Organization that the output object corresponds to. \nLevel of the Aramark Organization:\n  * `SLOC` - Sub Location\n  * `LOC` - Location\n  * `PC` - Profit Center\n  * `DST` - District\n  * `REG` - Region\n  * `LOB` - Line of Business\n  * `BSU` - Business Unit\n  * `DIV` - Division\n"
      required: true
      schema:
        type: string
        enum:
        - SLOC
        - LOC
        - PC
        - DST
        - REG
        - LOB
        - BSU
        - DIV
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment.  Only applicable in QA.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    statusParam:
      in: query
      name: status
      description: "Organization status:\n  * `A` - Active\n  * `X` - Inactive\n"
      required: false
      schema:
        type: string
        enum:
        - A
        - X
    searchParam:
      in: query
      name: search
      description: Used to search against the Organization Name.  Must be between 2-10 characters without white spaces
      required: false
      schema:
        type: string
    orgValueParam_2:
      in: path
      name: org_value
      required: true
      description: provide business organization code in URL to filter data set
      schema:
        type: string
    formatParam:
      in: query
      name: format
      required: false
      description: allows to change the output to a desired format. 'JSON' - JSON, 'CSV' - CSV, 'XLS' - Excel
      schema:
        type: string
        enum:
        - JSON
        - CSV
        - XLS
    sizeParam:
      in: query
      name: size
      description: Number of records to be returned in each page of result set
      schema:
        type: string
        default: 50
    smokeParam_2:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment. Only applicable in QA.
      schema:
        type: string
    pageParam:
      in: query
      name: page
      description: Page number of result set
      schema:
        type: number
        default: 1
    searchParam_2:
      in: query
      name: search
      description: Used to search a specific Profit Center.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
  schemas:
    divisions:
      type: object
      properties:
        division_name:
          type: string
          description: Aramark Division Name
        division:
          type: string
          description: Aramark Division Code
        division_id:
          type: number
          description: Division Node ID
        status:
          type: string
          description: The status of the Division. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Division Status
    districts:
      type: object
      properties:
        district_name:
          type: string
          description: Aramark District Name
        district:
          type: string
          description: Aramark District Code
        district_id:
          type: number
          description: District Node ID
        status:
          type: string
          description: The status of the District. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the District Status
    locations:
      type: object
      properties:
        location_name:
          type: string
          description: Aramark Location Name
        location:
          type: string
          description: Aramark Location Code
        location_id:
          type: number
          description: Location Node ID
        status:
          type: string
          description: The status of the Location. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Location Status
    business_units:
