          description: Aramark Business Unit Code
        business_units_id:
          type: number
          description: Business Unit Node ID
        status:
          type: string
          description: The status of the Business Unit. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Business Unit Status
    regions:
      type: object
      properties:
        region_name:
          type: string
          description: Aramark Region Name
        region:
          type: string
          description: Aramark Region Code
        region_id:
          type: number
          description: Region Node ID
        status:
          type: string
          description: The status of the Region. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Region Status
    profit_centers:
      type: object
      properties:
        profit_center_name:
          type: string
          description: Aramark Profit Center Name
        profit_center:
          type: string
          description: Aramark Profit Center Code
        profit_center_id:
          type: number
          description: Profit Center Node ID
        status:
          type: string
          description: The status of the Profit Center. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Profit Center Status
    lines_of_business:
      type: object
      properties:
        line_of_business_name:
          type: string
          description: Aramark Line of Business Name
        line_of_business:
          type: string
          description: Aramark Line of Business Code
        line_of_business_id:
          type: number
          description: Line of Business Node ID
        status:
          type: string
          description: The status of the Line of Business. A-Active, X-Inactive
        status_description:
          type: string
          description: Description of the Line of Business Status
    financial_organizations:
      type: object
      properties:
        organization_count:
          type: string
          description: The count of the number of Organizations returned in the response
        sub_locations:
          type: array
          items:
            $ref: '#/components/schemas/sub_locations'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/locations'
        profit_centers:
          type: array
          items:
            $ref: '#/components/schemas/profit_centers'
        districts:
          type: array
          items:
            $ref: '#/components/schemas/districts'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/regions'
        lines_of_business:
          type: array
          items:
            $ref: '#/components/schemas/lines_of_business'
        business_units:
          type: array
          items:
            $ref: '#/components/schemas/business_units'
        divisions:
          type: array
          items:
            $ref: '#/components/schemas/divisions'
    sub_locations:
      type: object
      properties:
        sub_location_name:
          type: string
          description: Aramark Sub Location Name
        sub_location:
          type: string
          description: Aramark Sub Location Code
        sub_location_id:
          type: number
