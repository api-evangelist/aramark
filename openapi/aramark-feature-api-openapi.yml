openapi: 3.2.0
info:
  description: 'This API will return a collection of Service Data.


    The base endpoint URL for this API in production is: `https://marko.aramark.net/v1/service`.


    For testing the API with the "Try" tool on this page or in your app, use either our testing server "qa-marko" or our development server "dev-marko".'
  version: 1.0.0-oas3
  title: Service Feature API
servers:
- url: https://qa-marko.aramark.net/v1/service
  description: Testing server
- url: https://dev-marko.aramark.net/v1/service
  description: Development server
tags:
- name: Feature
  description: A collection of Feature data
paths:
  /features:
    get:
      summary: Get Features for a Site or Location
      description: Returns a collection of Features for a Site or Location. site_id or location_id is required
      operationId: getFeatures
      tags:
      - Feature
      parameters:
      - $ref: '#/components/parameters/locationIdNoReqParam'
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/sourceSystemParam'
      - $ref: '#/components/parameters/bypassCacheParam'
      - $ref: '#/components/parameters/smokeParam'
      responses:
        '200':
          description: Lists Features
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: ENUM 'Success', 'Error' or 'Not Found'
                  count:
                    type: string
                    description: Number of records
                  service_features:
                    type: array
                    items:
                      $ref: '#/components/schemas/service_feature'
        '404':
          description: Requested resource does not exist.
        '405':
          description: HTTP Verb / Operation not supported
components:
  parameters:
    siteIdParam:
      name: site_id
      in: query
      description: ID of the Site
      required: false
      schema:
        type: number
    sourceSystemParam:
      name: source_system
      in: query
      description: source system
      required: false
      schema:
        type: string
        enum:
        - PRMA
        default: PRMA
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    smokeParam:
      in: header
      name: smoke
      description: 'When set to ''true'' this HTTP Header variable will route to the Integration environment.  Only applicable in QA Server.

        '
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    locationIdNoReqParam:
      name: location_id
      in: query
      description: ID of the Location
      required: false
      schema:
        type: number
  schemas:
    service_feature:
      type: object
      properties:
        feature_id:
          type: number
          description: ID of the Feature
        feature_name:
          type: string
          description: Name of the Feature
        default_flag:
          type: string
          description: Default Flag of the Feature
        override_location_ids:
          type: string
          description: Override Location IDs of the Feature
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: This HTTP Header variable will verify security
