components:
  parameters:
    orgValueParam:
      in: path
      name: org_value
      required: true
      description: provide business organization code in URL to filter data set
      schema:
        type: string
    formatParam:
      in: query
      name: format
      required: false
      description: allows to change the output to a desired format. 'JSON' - JSON, 'CSV' - CSV, 'XLS' - Excel
      schema:
        type: string
        enum:
        - JSON
        - CSV
        - XLS
    sizeParam:
      in: query
      name: size
      description: Number of records to be returned in each page of result set
      schema:
        type: string
        default: 50
    bypassCacheParam:
      in: header
      name: bypass-cache
      description: This HTTP Header variable will bypass cache.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        default: 'false'
    contactTypeParam:
      in: query
      name: contact_type
      description: optional parameter to limit results to a specfic address type
      schema:
        type: string
        enum:
        - manager
        - consumer_alert
    smokeParam:
      in: header
      name: smoke
      description: When set to 'true' this HTTP header variable will route the API call to the Integration testing environment. Only applicable in QA.
      schema:
        type: string
    pageParam:
      in: query
      name: page
      description: Page number of result set
      schema:
        type: number
        default: 1
    searchParam:
      in: query
      name: search
      description: Used to search a specific Business Unit.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_2:
      in: query
      name: search
      description: Used to search a specific District.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_3:
      in: query
      name: search
      description: Used to search a specific Division.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_4:
      in: query
      name: search
      description: Used to search a specific Line of Business.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_5:
      in: query
      name: search
      description: Used to search a specific Location.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_6:
      in: query
      name: search
      description: Used to search a specific Profit Center.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_7:
      in: query
      name: search
      description: Used to search a specific Region.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
    searchParam_8:
      in: query
      name: search
      description: Used to search a specific Sub Location.  Will match against Name and Value.  Maximum length of 20 characters.
      schema:
        type: string
  schemas:
    business_unit_contacts_details:
      type: object
      properties:
        org_value:
          type: string
          description: Aramark Organization code
        org_name:
          type: string
          description: Name of the Aramark Organization
        org_contact_status:
          type: string
          description: Indicator if the Business Unit contact is active or not
        contact_type:
          type: string
          description: Type of Business Unit contact
        first_name:
