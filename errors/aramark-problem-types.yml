note: 'The Marko APIs do not use application/problem+json. Two distinct error envelopes exist and they
  are not the same shape. (1) Gateway faults from Apigee: {"fault":{"faultstring":"...","detail":{"errorcode":"..."}}}
  — this is what an unauthenticated or unrouted call actually returns, and it is documented nowhere in
  the specs. (2) In-envelope application errors: successful 200 responses carry a status field enumerated
  Success | Error | Not Found, so an application-level error can arrive with HTTP 200. Agents must read
  the body status field, not only the status code.'
