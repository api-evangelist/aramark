aid: aramark
name: Aramark
url: https://raw.githubusercontent.com/api-evangelist/aramark/refs/heads/main/apis.yml
type: Index
description: 'Aramark is a Fortune 500 food, facilities and uniform services company. Its Marko platform is a data and AI
  layer over Aramark operations, published as 60 documented REST APIs on an Apigee gateway at marko.aramark.net and catalogued
  on the Marko Developer Portal. The surface spans the full Aramark organization hierarchy (division, region, district, line
  of business, business unit, client, location, sub location, profit center), point-of-sale transactions and daily sales,
  labor scheduling and daily labor, inventory and purchasing, product, recipe and nutrition data, service execution, food
  waste and IoT temperature monitoring. Aramark publishes every OpenAPI document itself, in JSON and YAML, in the public aramarkservicesinc/markoapis
  GitHub repository, and renders each one in an in-page RapiDoc console. Access is gated: you register an application, choose
  API products, and a per-application apikey is issued on approval.'
tags:
- Food Services
- Facilities Management
- Uniform Services
- Data Platform
- Point of Sale
- Labor
- Inventory
- Recipes and Nutrition
- Organization Hierarchy
- Fortune 500
