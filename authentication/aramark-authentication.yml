access_flow:
  steps:
  - Create an account on the Marko Developer Portal (https://marko-developers.aramark.net/user/register)
  - Register the application that will consume the APIs
  - Choose the API Products you want that application to reach
  - The request is submitted for approval
  - On approval an application API key is generated
  source: https://marko-developers.aramark.net/faqs
  note: 'Quoted from the portal FAQ: "In order to use a Marko API you must first create an account and register
    your application that will be consuming the APIs. This process will create an Application API Key that must
    be used with every request to the API." and "Upon approval your API Key will be generated." Entitlement is per
    API product, which is why an unentitled call to a live proxy returns the same 401 as a missing key.'
