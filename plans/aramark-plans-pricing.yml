description: 'Aramark publishes no plans, tiers or pricing for the Marko platform. There is no commercial surface
  at all: no price page, no free tier, no metered rate, no contact-sales pricing form.'
notes: 'The Marko Developer Portal is an access-controlled program rather than a product for sale. The FAQ
  states the model plainly: you create an account, register the application that will consume the APIs, choose
  the API Products you want, and the request is submitted for approval — a key is generated only on approval.
  Nothing on the portal, the catalog or aramark.com attaches a price to that. Marko reads as an internal and
  partner data platform published on public infrastructure, not a commercial API product.'
