identifier_note: 'The platform pivots on one polymorphic identifier: org_value, a path parameter carried by 5 distinct
  APIs. It resolves against a level in the Aramark organization hierarchy — division, region, district, line of
  business, business unit, client, location, sub location, profit center — each of which has its own Core Details
  contract. Reading any operational figure (labor, POS, revenue, waste) means first resolving the org_value for
  the level you want from the Organization APIs.'
